name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build and run unit tests
        run: |
          xcodebuild test \
            -project BreakReminder.xcodeproj \
            -scheme BreakReminder \
            -destination 'platform=macOS' \
            -only-testing:BreakReminderTests \
            CODE_SIGNING_ALLOWED=NO
