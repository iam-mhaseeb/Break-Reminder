name: Release

# Builds an unsigned Release app and attaches BreakReminder.zip to the GitHub
# release for the pushed tag (for example v1.0.1).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          xcodebuild build \
            -project BreakReminder.xcodeproj \
            -scheme BreakReminder \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/BreakReminder.app BreakReminder.zip

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" BreakReminder.zip --clobber
